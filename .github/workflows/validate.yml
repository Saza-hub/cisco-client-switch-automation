name: Validate switch profiles
on:
  push:
    paths: ['src/**', 'clients/**', 'tests/**', 'requirements.txt', '.github/workflows/validate.yml']
  pull_request:
  workflow_dispatch:
jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - run: |
          for profile in clients/*.yaml; do
            python -m src.switchctl validate --profile "$profile"
          done
